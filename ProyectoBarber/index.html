<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand" href="index.html">Barber Shop</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Inicio</a>
            <a class="nav-link" href="barberos.html">Barberos</a>
            <a class="nav-link" href="servicios.html">Servicios</a>
            <a class="nav-link" href="citas.html">Citas</a>
        </div>
    </div>
    </nav>  
    <header>
        <h1>Barber Shop</h1>
        <img src="Barber.jpeg" alt="Logo de la Barbería" class="logo" width="400" height="2
        00">
        <h1>Registro de Clientes</h1>
        <p>Por favor, completa el siguiente formulario para registrarte.</p>
    </header>

    <main>
        <form action="barberos.html" method="POST" class="registro-form">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" id="apellido" name="apellido" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a href="barberos.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </main>
</body>
<footer>
    <div class="footer-content">
        <p>Barber Shop. Sistema de Citas.</p>
    </div>
</html>
