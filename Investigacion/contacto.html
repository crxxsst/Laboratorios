        <h1 class="titulo-seccion">Contáctanos</h1>
        <p>Completa tus datos para solicitar información.</p>
        <form>
            <label class="form-label" for="nombre">Nombre</label>

            <label class="form-label" for="mensaje">Mensaje</label>
            <textarea class="form-control mb-3" id="mensaje" rows="4" required></textarea>
            <button class="btn btn-primary boton" type="submit">Enviar</button>
